schema_version: "1.0"
workflow:
  id: "vixrex-sdd"
  name: "Vixrex zorunlu gelişim zinciri"
  version: "2.0.0"
  author: "Vixrex"
  description: "Anayasa → Specify → Clarify → Plan → Checklist → Tasks → Analyze → Implement → Converge → Review"

requires:
  speckit_version: ">=0.8.5"
  integrations:
    any:
      - "generic"
      - "copilot"
      - "codex"
      - "claude"
      - "gemini"
      - "kilo"
      - "cursor"
      - "opencode"

inputs:
  spec:
    type: string
    required: true
    prompt: "Furkan'ın doğal dilde istediği kullanıcı sonucunu yaz"
  integration:
    type: string
    default: "auto"
    prompt: "Kullanılan araç; auto mevcut aracı seçer"

steps:
  - id: constitution
    type: gate
    message: "Vixrex Anayasası okundu ve bu işin değişmez sınırları çıkarıldı mı?"
    options: [approve, reject]
    on_reject: abort

  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: clarify
    command: speckit.clarify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: checklist
    command: speckit.checklist
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: analyze
    command: speckit.analyze
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: converge
    command: speckit.converge
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: convergence-gate
    type: gate
    message: "Converge eksik bulduysa görevler eklendi ve Implement → Converge döngüsü sonuç YAKINSADI olana kadar tekrarlandı mı?"
    options: [approve, reject]
    on_reject: abort

  - id: review
    type: gate
    message: "Üreticiden bağımsız inceleme tamamlandı, PR ve geri alma yolu hazır mı?"
    options: [approve, reject]
    on_reject: abort
