schema_version: "1.0"
workflow:
  id: "vixrex-sdd"
  name: "Vixrex ortak gelişim zinciri"
  version: "2.2.0"
  author: "Vixrex"
  description: "Kullanılan araçtan bağımsız Vixrex geliştirme akışı"

requires:
  speckit_version: ">=0.8.5"

inputs:
  spec:
    type: string
    required: true
    prompt: "Furkan'ın doğal dilde istediği kullanıcı sonucunu yaz"
  integration:
    type: string
    default: "auto"
    prompt: "Mevcut aracı otomatik kullan"

steps:
  - id: constitution
    type: gate
    message: "Vixrex Anayasası okundu ve sınırlar çıkarıldı mı?"
    options: [approve, reject]
    on_reject: abort

  - id: kesif
    type: gate
    message: "Keşif yazıldı mı: bugün ne var (ölçülmüş dosya yollarıyla), gelişim nereden başlar, nerede biter, ne ve nasıl gözükecek, esnafa/Vixrex'e/tüketiciye ne katar? Furkan onayladı mı?"
    options: [approve, reject]
    on_reject: abort

  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: clarify
    command: speckit.clarify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: checklist
    command: speckit.checklist
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: analyze
    command: speckit.analyze
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: converge
    command: speckit.converge
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: convergence-gate
    type: gate
    message: "Eksik varsa Implement → Converge döngüsü YAKINSADI sonucuna ulaştı mı?"
    options: [approve, reject]
    on_reject: abort

  - id: review
    type: gate
    message: "Bağımsız inceleme, PR ve geri alma yolu hazır mı?"
    options: [approve, reject]
    on_reject: abort
