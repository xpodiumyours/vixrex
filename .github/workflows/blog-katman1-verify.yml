name: TEMP — Blog Katman 1 doğrulama

# Yalnız Katman 1 branch'inde, mevcut main lint/test baseline hatalarına
# takılmadan Katman 1 için tip/test/build kanıtı üretir.
# VERIFY tamamlanınca PR'dan silinecek; main'e girmeyecek.
on:
  push:
    branches:
      - feat/blog-omurga-katman-1

permissions:
  contents: read

jobs:
  verify:
    name: Katman 1 — tip, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: public_web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: public_web/package-lock.json

      - name: Bağımlılıklar
        run: npm ci

      - name: Tip kontrolü
        run: npx tsc --noEmit

      - name: Tam test paketi — baseline envanteri
        continue-on-error: true
        run: npm run test

      - name: Katman 1 kapı testleri
        run: >-
          npx vitest run
          tests/blog-yayin-anahtari.test.ts
          tests/blog-seo.test.ts
          tests/sitemap-products.test.ts
          tests/sitemap-demo-haric-contract.test.ts
          tests/footer-yasal-baglanti-contract.test.ts
          tests/public-store-access-contract.test.ts
          tests/kesfet-veri-contract.test.ts

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
