name: Database Backup

on:
  schedule:
    - cron: '0 3 * * 0'  # Every Sunday at 03:00 UTC
  workflow_dispatch:
    inputs:
      backup_type:
        description: 'Backup type'
        required: false
        default: 'manual'
        type: choice
        options:
          - manual
          - weekly

jobs:
  backup:
    name: Backup Supabase Database
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          chmod +x supabase/backup/backup_database.sh
          BACKUP_TYPE="${{ github.event.inputs.backup_type || 'weekly' }}"
          ./supabase/backup/backup_database.sh "$BACKUP_TYPE"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-${{ github.run_id }}
          path: supabase/backup/dumps/vixrex_*.dump
          retention-days: 30
          compression-level: 6