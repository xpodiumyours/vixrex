name: Database Backup

on:
  schedule:
    - cron: '0 3 * * 0'  # Every Sunday at 03:00 UTC
  workflow_dispatch:
    inputs:
      backup_type:
        description: 'Backup type'
        required: false
        default: 'manual'
        type: choice
        options:
          - manual
          - weekly

jobs:
  backup:
    name: Backup Supabase Database
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL 17 client
        # Sunucu PostgreSQL 17.6; Ubuntu varsayılan paketi (16) pg_dump sürüm
        # uyumsuzluğundan abort ediyordu (2026-08-17 bulgusu). PGDG reposundan
        # 17.x kurulur — pg_dump sürümü sunucuyla eşleşmeli.
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Run backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # postgresql-client-17 /usr/lib/postgresql/17/bin altına kurulur;
          # /usr/bin/pg_dump symlink'i hâlâ 16'yı gösterir. PATH'e 17 eklenir.
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          pg_dump --version
          chmod +x supabase/backup/backup_database.sh
          BACKUP_TYPE="${{ github.event.inputs.backup_type || 'weekly' }}"
          ./supabase/backup/backup_database.sh "$BACKUP_TYPE"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-${{ github.run_id }}
          path: supabase/backup/dumps/vixrex_*.dump
          retention-days: 30
          compression-level: 6