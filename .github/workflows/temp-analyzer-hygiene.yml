name: TEMP analyzer hygiene

on:
  push:
    branches:
      - repair/main-baseline-20260905

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/main-baseline-20260905
          fetch-depth: 0

      - name: Apply remaining verified analyzer hygiene edits
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"expected text not found: {path}: {old[:80]!r}")
              p.write_text(s.replace(old, new, 1))

          # value extractor: five brace-only lint fixes
          p = Path('lib/services/vixrex_nlu/vixrex_value_extractor.dart')
          s = p.read_text()
          pairs = [
            ("      if (withoutTrailingVerb.trim().isNotEmpty)\n        return withoutTrailingVerb.trim();",
             "      if (withoutTrailingVerb.trim().isNotEmpty) {\n        return withoutTrailingVerb.trim();\n      }"),
            ("    if (quotedAfter != null && quotedAfter.trim().isNotEmpty)\n      return quotedAfter.trim();",
             "    if (quotedAfter != null && quotedAfter.trim().isNotEmpty) {\n      return quotedAfter.trim();\n    }"),
            ("      if (digits.length >= 10 && digits.length <= 11)\n        return mLand.group(0)?.trim();",
             "      if (digits.length >= 10 && digits.length <= 11) {\n        return mLand.group(0)?.trim();\n      }"),
            ("    if (RegExp(r'^(yanlis|hatali|bozuk|degistir)$').hasMatch(normCand))\n      return null;",
             "    if (RegExp(r'^(yanlis|hatali|bozuk|degistir)$').hasMatch(normCand)) {\n      return null;\n    }"),
            ("    if (RegExp(r'^(yanlis|hatali|bozuk|degistir)$').hasMatch(normCleaned))\n      return null;",
             "    if (RegExp(r'^(yanlis|hatali|bozuk|degistir)$').hasMatch(normCleaned)) {\n      return null;\n    }"),
          ]
          for old,new in pairs:
              if old not in s: raise SystemExit(f'value extractor pattern not found: {old!r}')
              s=s.replace(old,new,1)
          p.write_text(s)

          # field validator: eight brace-only lint fixes; return values unchanged
          p = Path('lib/services/vixrex_nlu/vixrex_field_validator.dart')
          s = p.read_text()
          pairs = [
            ("      if (min != null && num < min)\n        return (\n          ok: false,\n          hata: '$etiket en az $min olabilir.',\n          normalizedDeger: null,\n        );",
             "      if (min != null && num < min) {\n        return (\n          ok: false,\n          hata: '$etiket en az $min olabilir.',\n          normalizedDeger: null,\n        );\n      }"),
            ("      if (max != null && num > max)\n        return (\n          ok: false,\n          hata: '$etiket en fazla $max olabilir.',\n          normalizedDeger: null,\n        );",
             "      if (max != null && num > max) {\n        return (\n          ok: false,\n          hata: '$etiket en fazla $max olabilir.',\n          normalizedDeger: null,\n        );\n      }"),
            ("    if (lengthErr != null)\n      return (ok: false, hata: lengthErr, normalizedDeger: null);",
             "    if (lengthErr != null) {\n      return (ok: false, hata: lengthErr, normalizedDeger: null);\n    }"),
            ("          if (norm == null)\n            return (\n              ok: false,\n              hata: WhatsAppLinkHelper.invalidNumberMessage,\n              normalizedDeger: null,\n            );",
             "          if (norm == null) {\n            return (\n              ok: false,\n              hata: WhatsAppLinkHelper.invalidNumberMessage,\n              normalizedDeger: null,\n            );\n          }"),
            ("          if (!exists)\n            return (\n              ok: false,\n              hata: '$etiket için geçersiz seçim.',\n              normalizedDeger: null,\n            );",
             "          if (!exists) {\n            return (\n              ok: false,\n              hata: '$etiket için geçersiz seçim.',\n              normalizedDeger: null,\n            );\n          }"),
            ("          if (hata != null)\n            return (ok: false, hata: hata, normalizedDeger: null);",
             "          if (hata != null) {\n            return (ok: false, hata: hata, normalizedDeger: null);\n          }"),
            ("    if (min != null && len > 0 && len < min)\n      return '${alan.etiket} en az $min karakter olmalı.';",
             "    if (min != null && len > 0 && len < min) {\n      return '${alan.etiket} en az $min karakter olmalı.';\n    }"),
            ("    if (max != null && len > max)\n      return '${alan.etiket} en fazla $max karakter olabilir.';",
             "    if (max != null && len > max) {\n      return '${alan.etiket} en fazla $max karakter olabilir.';\n    }"),
          ]
          for old,new in pairs:
              if old not in s: raise SystemExit(f'validator pattern not found: {old!r}')
              s=s.replace(old,new,1)
          p.write_text(s)

          replace('lib/config/web_navigate_web.dart',
                  "/// Web'de aynı sekmede navigasyon — package:web implementasyonu.\n/// dart:html Wasm'da `dart.library.html` false olur ve stub'a düşer, bu yüzden package:web kullanılır.",
                  "// Web'de aynı sekmede navigasyon — package:web implementasyonu.\n// dart:html Wasm'da `dart.library.html` false olur ve stub'a düşer, bu yüzden package:web kullanılır.")
          replace('test/vitrin_store_card_test.dart',
                  "import 'package:vixrex/models/store_product.dart';\n", '')
          PY

      - name: Show narrow diff
        run: git diff --check && git diff --stat && git diff -- lib/services/vixrex_nlu/vixrex_value_extractor.dart lib/services/vixrex_nlu/vixrex_field_validator.dart lib/config/web_navigate_web.dart test/vitrin_store_card_test.dart

      - name: Commit verified hygiene only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/vixrex_nlu/vixrex_value_extractor.dart lib/services/vixrex_nlu/vixrex_field_validator.dart lib/config/web_navigate_web.dart test/vitrin_store_card_test.dart
          git commit -m "chore(flutter): clear remaining analyzer infos"
          git fetch origin repair/main-baseline-20260905
          git rebase origin/repair/main-baseline-20260905
          git push origin HEAD:repair/main-baseline-20260905
