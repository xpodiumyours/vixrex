name: Katman 3 Blog Import Verify TEMP

on:
  push:
    branches:
      - feat/vitrine-yazi-cekme-katman-3

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.4"

jobs:
  format-probe:
    name: Katman 3 — Dart format farkı
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Dart format ve fark
        run: |
          dart format lib/services/article_service.dart lib/screens/blog_post_list_screen.dart
          git diff -- lib/services/article_service.dart lib/screens/blog_post_list_screen.dart
          git diff --exit-code -- lib/services/article_service.dart lib/screens/blog_post_list_screen.dart
