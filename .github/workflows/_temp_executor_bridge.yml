name: TEMP Executor bridge apply

on:
  push:
    branches:
      - repair/main-baseline-20260905

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: repair/main-baseline-20260905
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - name: Apply narrow bridge
        run: python -c "import base64;exec(base64.b64decode(''))"

      - name: Format touched Dart files
        run: dart format lib/controllers/store_editor_controller.dart lib/services/vixrex_nlu/vixrex_executor.dart

      - name: Commit bridge and remove temp workflow
        run: |
          set -euo pipefail
          rm .github/workflows/_temp_executor_bridge.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/controllers/store_editor_controller.dart lib/services/vixrex_nlu/vixrex_executor.dart .github/workflows/_temp_executor_bridge.yml
          git diff --cached --stat
          git commit -m "fix(flutter): keep ChangeNotifier notification inside controller"
          git push origin HEAD:repair/main-baseline-20260905
