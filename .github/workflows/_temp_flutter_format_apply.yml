name: TEMP Apply Flutter format

on:
  push:
    branches:
      - repair/main-baseline-20260905

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: repair/main-baseline-20260905
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Apply exact repository formatter
        run: |
          set -euo pipefail
          dart --version
          dart format lib test

          mapfile -t changed < <(git diff --name-only -- lib test | sort)
          expected=(
            lib/config/app_router.dart
            lib/config/vixrex_niyet_sozlugu.g.dart
            lib/screens/home_shell_screen.dart
            lib/services/canonical_rental_claim_service.dart
            lib/services/migration/local_draft_migration_service.dart
            lib/services/product_conversation_logger.dart
            lib/services/vixrex_nlu/vixrex_conversation_memory.dart
            lib/services/vixrex_nlu/vixrex_field_validator.dart
            lib/services/vixrex_nlu/vixrex_intent_resolver.dart
            lib/services/vixrex_nlu/vixrex_nlu_pipeline.dart
            lib/services/vixrex_nlu/vixrex_value_extractor.dart
            lib/services/vixrex_profile_snapshot.dart
            lib/services/working_draft/draft_conflict_resolver.dart
            lib/services/working_draft/local_queue_working_draft_adapter.dart
            lib/services/working_draft/supabase_working_draft_adapter.dart
            lib/widgets/product/product_management_sheet.dart
            test/vitrin_store_card_test.dart
            test/vixrex_nlu_faz1_test.dart
            test/vixrex_nlu_faz2_test.dart
            test/vixrex_nlu_faz3_test.dart
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [ "${#changed[@]}" -ne 20 ] || ! diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}"); then
            echo "::error::Formatter değişiklik kümesi doğrulanmış 20 dosyayla eşleşmiyor."
            exit 1
          fi

      - name: Commit formatter output and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/_temp_flutter_format_apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test .github/workflows/_temp_flutter_format_apply.yml
          git diff --cached --stat
          git commit -m "style(flutter): apply Dart 3.12.2 formatter"
          git push origin HEAD:repair/main-baseline-20260905
