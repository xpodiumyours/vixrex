name: PR425 Dart format diagnostic

on:
  push:
    branches:
      - diagnostic/425-dart-format-output-20260906

permissions:
  contents: read

jobs:
  format-diff:
    name: PR425 format diff
    runs-on: [self-hosted, windows, vixrex]
    timeout-minutes: 10
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Format only the three failing files and print exact diff
        run: |
          dart format test/architecture_routing_contract_test.dart test/main_navigation_screen_test.dart test/public_site_config_bos_ayar_test.dart
          echo "===== FORMAT DIFF START ====="
          git diff -- test/architecture_routing_contract_test.dart test/main_navigation_screen_test.dart test/public_site_config_bos_ayar_test.dart
          echo "===== FORMAT DIFF END ====="
