name: PR425 Dart format diagnostic

on:
  push:
    branches:
      - diagnostic/425-dart-format-output-20260906

permissions:
  contents: read

jobs:
  format-diff:
    name: PR425 format diff
    runs-on: [self-hosted, windows, vixrex]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Format only the three failing files and print exact diff
        shell: pwsh
        run: |
          $dart = 'C:\vixrex-runner\_work\_tool\flutter\stable-3.44.4-x64\flutter\bin\dart.bat'
          if (-not (Test-Path $dart)) {
            throw "Dart executable not found at $dart"
          }
          & $dart format --language-version=3.7 test/architecture_routing_contract_test.dart test/main_navigation_screen_test.dart test/public_site_config_bos_ayar_test.dart
          Write-Host '===== FORMAT DIFF START ====='
          git diff -- test/architecture_routing_contract_test.dart test/main_navigation_screen_test.dart test/public_site_config_bos_ayar_test.dart
          Write-Host '===== FORMAT DIFF END ====='
