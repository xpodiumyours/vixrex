name: TEMP — Blog Katman 2.5 sertleştirme doğrulama

on:
  push:
    branches:
      - feat/blog-kutuphanesi-katman-2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardening-verify:
    name: Katman 2.5 — migration zinciri + RLS/API davranışı
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: public_web/package-lock.json

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Seed adımını yalnız bu iş için kapat
        run: |
          sed -i '/^# If enabled, seeds the database after migrations during a db reset\.$/{n;s/^enabled = true$/enabled = false/}' supabase/config.toml

      - name: Yerel Supabase — migration zinciri sıfırdan
        run: |
          supabase start
          supabase status -o env > /tmp/sb.env
          API_URL_VALUE="$(grep '^API_URL=' /tmp/sb.env | cut -d= -f2- | sed 's/^"//;s/"$//')"
          ANON_KEY_VALUE="$(grep '^ANON_KEY=' /tmp/sb.env | cut -d= -f2- | sed 's/^"//;s/"$//')"
          SERVICE_ROLE_KEY_VALUE="$(grep '^SERVICE_ROLE_KEY=' /tmp/sb.env | cut -d= -f2- | sed 's/^"//;s/"$//')"
          test -n "$API_URL_VALUE"
          test -n "$ANON_KEY_VALUE"
          test -n "$SERVICE_ROLE_KEY_VALUE"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL_VALUE" >> "$GITHUB_ENV"
          echo "SUPABASE_URL=$API_URL_VALUE" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY_VALUE" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY_VALUE" >> "$GITHUB_ENV"

      - name: GRANT güvenlik bekçisi
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            v_count integer;
            v_detay text;
          begin
            select count(*), string_agg(format('%s: %s -> %s', grantee.rolname, c.relname, a.privilege_type), ', ')
            into v_count, v_detay
            from pg_class c
            cross join lateral aclexplode(c.relacl) a
            join pg_roles grantee on grantee.oid = a.grantee
            where c.relnamespace = 'public'::regnamespace
              and c.relkind in ('r', 'p')
              and grantee.rolname in ('anon', 'authenticated')
              and a.privilege_type in ('TRUNCATE', 'MAINTAIN', 'REFERENCES', 'TRIGGER');

            if v_count > 0 then
              raise exception 'GRANT güvenlik bekçisi: % kayıt bulundu. Detay: %', v_count, v_detay;
            end if;
          end $$;
          SQL

      - name: Next.js bağımlılıkları
        working-directory: public_web
        run: npm ci

      - name: Production build
        working-directory: public_web
        run: npm run build

      - name: Next.js production server
        working-directory: public_web
        run: |
          npx next start -p 3000 > /tmp/vixrex-next.log 2>&1 &
          echo $! > /tmp/vixrex-next.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vixrex-next.log
          exit 1

      - name: Gerçek RLS + admin API davranış testi
        working-directory: public_web
        env:
          E2E_PUBLIC_BASE_URL: http://127.0.0.1:3000
        run: node scripts/verify-blog-hardening.mjs

      - name: Next log — yalnız hata durumunda
        if: failure()
        run: cat /tmp/vixrex-next.log || true

      - name: Next.js kapat
        if: always()
        run: |
          if [ -f /tmp/vixrex-next.pid ]; then
            kill "$(cat /tmp/vixrex-next.pid)" || true
          fi

      - name: Supabase kapat
        if: always()
        run: supabase stop
