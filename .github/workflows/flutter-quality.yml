name: Flutter Quality

on:
  pull_request:
    paths:
      - "lib/**"
      - "test/**"
      - "android/**"
      - "ios/**"
      - "web/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/flutter-quality.yml"
  push:
    branches:
      - main
    paths:
      - "lib/**"
      - "test/**"
      - "android/**"
      - "ios/**"
      - "web/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/flutter-quality.yml"

concurrency:
  group: flutter-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.4"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Dart format check
        shell: bash
        run: |
          base_ref="${{ github.base_ref }}"
          if [[ -z "$base_ref" ]]; then
            base_ref="main"
          fi
          mapfile -t dart_files < <(
            git diff --name-only --diff-filter=ACMRT \
              "origin/$base_ref...HEAD" -- "*.dart"
          )
          if (( ${#dart_files[@]} > 0 )); then
            dart format "${dart_files[@]}"
            git diff --exit-code -- "${dart_files[@]}"
          fi

      - name: P0 regression tests
        run: flutter test test/store_editor_controller_test.dart

      - name: Static analysis
        run: flutter analyze

      - name: Full Flutter test suite
        run: flutter test
