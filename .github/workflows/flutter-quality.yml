name: Flutter Quality

on:
  pull_request:
    paths:
      - "lib/**/*.dart"
      - "test/**/*.dart"
      - "integration_test/**/*.dart"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/flutter-quality.yml"
  push:
    branches:
      - main
    paths:
      - "lib/**/*.dart"
      - "test/**/*.dart"
      - "integration_test/**/*.dart"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/flutter-quality.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test

      - name: Build web (release)
        run: flutter build web --release
