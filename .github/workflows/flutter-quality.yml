name: Flutter Quality

on:
  pull_request:
    paths:
      - "lib/**"
      - "test/**"
      - "android/**"
      - "ios/**"
      - "web/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/flutter-quality.yml"
  push:
    branches:
      - main
    paths:
      - "lib/**"
      - "test/**"
      - "android/**"
      - "ios/**"
      - "web/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/flutter-quality.yml"

concurrency:
  group: flutter-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.4"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: P0 regression tests
        run: flutter test test/store_editor_controller_test.dart

      - name: Static analysis
        run: flutter analyze

      - name: Full Flutter test suite
        run: flutter test
