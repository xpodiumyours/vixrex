name: Supabase Security

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-security.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-security.yml"

permissions:
  contents: read

jobs:
  security:
    name: Supabase security gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Disable seed for schema security test
        run: |
          sed -i '/^# If enabled, seeds the database after migrations during a db reset\.$/{n;s/^enabled = true$/enabled = false/}' supabase/config.toml

      - name: Start local Supabase
        run: supabase start

      - name: Check dangerous table grants
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            v_count integer;
            v_detail text;
          begin
            select count(*), string_agg(format('%s: %s -> %s', grantee.rolname, c.relname, a.privilege_type), ', ')
            into v_count, v_detail
            from pg_class c
            cross join lateral aclexplode(c.relacl) a
            join pg_roles grantee on grantee.oid = a.grantee
            where c.relnamespace = 'public'::regnamespace
              and c.relkind in ('r', 'p')
              and grantee.rolname in ('anon', 'authenticated')
              and a.privilege_type in ('TRUNCATE', 'MAINTAIN', 'REFERENCES', 'TRIGGER');

            if v_count > 0 then
              raise exception 'Unsafe table grants: %', v_detail;
            end if;
          end $$;
          SQL

      - name: Check engagement events access contract
        run: PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/vitrin_engagement_events_security_smoke.sql

      - name: Stop local Supabase
        if: always()
        run: supabase stop
