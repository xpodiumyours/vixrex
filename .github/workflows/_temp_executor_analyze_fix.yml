name: TEMP Executor analyzer fix

on:
  push:
    branches:
      - repair/main-baseline-20260905

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: repair/main-baseline-20260905
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - name: Apply narrow protected-notify fix
        run: |
          python - <<'PY'
          from pathlib import Path

          controller_path = Path('lib/controllers/store_editor_controller.dart')
          executor_path = Path('lib/services/vixrex_nlu/vixrex_executor.dart')

          controller = controller_path.read_text(encoding='utf-8')
          needle = """  void _guncelle(void Function(StoreData data) yaz) {\n    yaz(_data);\n    notifyListeners();\n  }\n"""
          bridge = """

  /// Servis/controller dışındaki mevcut veri mutasyonlarından sonra UI'ı yeniler.
  /// `ChangeNotifier.notifyListeners` protected olduğu için çağrı controller içinde kalır.
  void refreshAfterExternalDataMutation() => notifyListeners();
"""
          if 'refreshAfterExternalDataMutation' not in controller:
              if controller.count(needle) != 1:
                  raise SystemExit('controller insertion point mismatch')
              controller = controller.replace(needle, needle + bridge, 1)
              controller_path.write_text(controller, encoding='utf-8')

          executor = executor_path.read_text(encoding='utf-8')
          count = executor.count('controller.notifyListeners();')
          if count != 17:
              raise SystemExit(f'expected 17 protected notify calls, found {count}')
          executor = executor.replace(
              'controller.notifyListeners();',
              'controller.refreshAfterExternalDataMutation();',
          )
          executor_path.write_text(executor, encoding='utf-8')
          PY

          dart format lib/controllers/store_editor_controller.dart lib/services/vixrex_nlu/vixrex_executor.dart

          if grep -q 'controller.notifyListeners();' lib/services/vixrex_nlu/vixrex_executor.dart; then
            echo "::error::Protected notify call remains in executor."
            exit 1
          fi

      - name: Commit fix and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/_temp_executor_analyze_fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/controllers/store_editor_controller.dart lib/services/vixrex_nlu/vixrex_executor.dart .github/workflows/_temp_executor_analyze_fix.yml
          git diff --cached --stat
          git commit -m "fix(flutter): keep ChangeNotifier notification inside controller"
          git push origin HEAD:repair/main-baseline-20260905
