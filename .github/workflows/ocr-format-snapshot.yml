name: OCR format snapshot

on:
  push:
    branches:
      - tmp/ocr-format-snapshot-20260922

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.4"

jobs:
  verify:
    name: Format + analyze + tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Format only OCR change surface
        run: |
          dart format \
            lib/controllers/ocr_controller.dart \
            lib/screens/ocr_scanner_screen.dart \
            lib/services/ocr/invoice_row_parser.dart \
            lib/services/ocr/ocr_service.dart \
            lib/services/ocr/ocr_text_parser.dart \
            test/ocr/invoice_row_parser_test.dart

      - name: Confirm formatting is stable
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/controllers/ocr_controller.dart \
            lib/screens/ocr_scanner_screen.dart \
            lib/services/ocr/invoice_row_parser.dart \
            lib/services/ocr/ocr_service.dart \
            lib/services/ocr/ocr_text_parser.dart \
            test/ocr/invoice_row_parser_test.dart

      - name: Static analysis
        run: dart analyze --fatal-infos

      - name: Full Flutter tests
        run: flutter test --reporter expanded

      - name: Upload formatted OCR files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-formatted-files
          path: |
            lib/controllers/ocr_controller.dart
            lib/screens/ocr_scanner_screen.dart
            lib/services/ocr/invoice_row_parser.dart
            lib/services/ocr/ocr_service.dart
            lib/services/ocr/ocr_text_parser.dart
            test/ocr/invoice_row_parser_test.dart
          retention-days: 1
          if-no-files-found: error
