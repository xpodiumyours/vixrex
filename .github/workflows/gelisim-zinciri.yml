name: Gelişim zinciri

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  zincir:
    name: Gelişim zinciri
    runs-on: [self-hosted, windows, vixrex]
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Zorunlu aşamaları doğrula
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python .github/scripts/gelisim_zinciri_guard.py --base "$BASE_SHA" --head "$HEAD_SHA"
