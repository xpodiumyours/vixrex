name: TEMP Flutter warning cleanup

on:
  push:
    branches:
      - repair/main-baseline-20260905

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: repair/main-baseline-20260905
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Remove five analyzer-only warnings
        run: python -c "import base64;exec(base64.b64decode(''))"

      - name: Format touched files
        run: dart format lib/services/vixrex_nlu/vixrex_nlu_pipeline.dart lib/services/vixrex_nlu/vixrex_value_extractor.dart lib/services/working_draft/local_queue_working_draft_adapter.dart test/vixrex_nlu_faz1_test.dart

      - name: Commit cleanup and remove temp workflow
        run: |
          set -euo pipefail
          rm .github/workflows/_temp_flutter_warning_cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/vixrex_nlu/vixrex_nlu_pipeline.dart lib/services/vixrex_nlu/vixrex_value_extractor.dart lib/services/working_draft/local_queue_working_draft_adapter.dart test/vixrex_nlu_faz1_test.dart .github/workflows/_temp_flutter_warning_cleanup.yml
          git commit -m "fix(flutter): remove analyzer-only warnings"
          git fetch origin repair/main-baseline-20260905
          git rebase origin/repair/main-baseline-20260905
          git push origin HEAD:repair/main-baseline-20260905
