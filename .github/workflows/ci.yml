name: CI

# Her PR ve main push'ında ucuz yüzey sınıflandırması çalışır.
# Flutter, şema ve Next.js işleri yalnız ilgili production yüzeyi değiştiğinde koşar.
# Bilinmeyen veya sınıflandırılamayan path güvenli varsayımla bütün işleri açar.

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  # gitleaks-action, pull_request olayında PR'ın commit listesini
  # (GET /repos/{o}/{r}/pulls/{n}/commits) okur. Bu izin olmadan 403
  # "Resource not accessible by integration" alıp ÇÖKER — sır bulduğu
  # için değil, listeyi okuyamadığı için kırmızı olur (2026-08-19: beş
  # PR'ın beşi de bu yüzden kırmızıydı; GitHub yanıtı zaten eksik izni
  # söylüyordu: x-accepted-github-permissions: pull_requests=read).
  pull-requests: read

env:
  FLUTTER_VERSION: "3.44.4"

jobs:
  secret-tarama:
    name: Secret sızıntı taraması
    # NOT (2026-09-07): Bu iş tek başına ubuntu-latest'te kalmıştı. GitHub
    # Actions kotası tükendiği için runner hiç atanmıyor ve iş ~2 saniyede
    # düşüyordu: main dahil HER dal kırmızı görünüyordu, koddan bağımsız
    # olarak (#413'ten beri). Self-hosted Windows runner'a alındı.
    #
    # gitleaks-action kullanılmıyor: Windows binary'sini yanlış URL'den
    # arıyor (404). Onun yerine resmi sürüm ikilisi doğrudan indirilip
    # çalıştırılıyor. İndirme runner'da /tmp altında kalıcı, sonraki
    # koşularda yeniden indirilmiyor.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        # auth-config-check ile aynı gerekçe: PATH'teki ilk "bash" Git Bash olmalı.
        shell: bash
    env:
      GITLEAKS_SURUM: "8.30.1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Tarama git geçmişini de kapsıyor; sığ klon yetmez.
          fetch-depth: 0

      - name: Gitleaks kur ve tara
        run: |
          set -euo pipefail
          kur="/tmp/gitleaks-${GITLEAKS_SURUM}"
          mkdir -p "$kur"
          if [ ! -x "$kur/gitleaks" ]; then
            paket="gitleaks_${GITLEAKS_SURUM}_linux_x64.tar.gz"
            curl -fsSL -o "$kur/$paket"               "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_SURUM}/${paket}"
            tar -xzf "$kur/$paket" -C "$kur"
          fi
          "$kur/gitleaks" version
          "$kur/gitleaks" git . -c .gitleaks.toml --redact --no-banner

  auth-config-check:
    name: Supabase auth security config check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check leaked password protection
        # DİKKAT (2026-08-17): secrets context'i step-level `if` içinde
        # KULLANILAMAZ (yalnız env/with içinde geçerli) — önceki sürüm
        # `if: ${{ secrets.X != '' }}` yazıyordu, bu workflow dosyasını
        # GitHub'da geçersiz kılıyordu ve ci.yml #189'dan beri HİÇ
        # çalışmıyordu (0s "invalid workflow" fail). Davranış korundu:
        # secret'lar tanımlı değilse adım sessizce atlanır.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Supabase secret'ları tanımlı değil — kontrol atlanıyor."
            exit 0
          fi
          config=$(curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth")

          hibp=$(echo "$config" | jq -r '.password_hibp_enabled // false')
          min_len=$(echo "$config" | jq -r '.password_min_length // 0')

          echo "password_hibp_enabled=$hibp"
          echo "password_min_length=$min_len"

          if [ "$hibp" != "true" ]; then
            echo "::error::Leaked Password Protection kapalı (password_hibp_enabled=false). Supabase Dashboard → Authentication → Password Protection üzerinden açın."
            exit 1
          fi

          if [ "$min_len" -lt 8 ] 2>/dev/null; then
            echo "::error::Minimum password length $min_len < 8. Supabase Dashboard → Authentication üzerinden en az 8 yapın."
            exit 1
          fi

  changes:
    name: Değişiklik yüzeyi
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    outputs:
      flutter: ${{ steps.classify.outputs.flutter }}
      schema: ${{ steps.classify.outputs.schema }}
      public_web: ${{ steps.classify.outputs.public_web }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Yüzeyleri sınıflandır
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python .github/scripts/changed_surfaces.py --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  grant-guard:
    name: Supabase yerel doğrulama — GRANT güvenlik bekçisi
    needs: changes
    # supabase/ altındaki her değişiklik changed_surfaces.py'de zaten
    # schema=true üretiyor (bkz. o dosyadaki supabase/ kuralı) — ayrı bir
    # yüzey eklemeye gerek yok, aynı sinyali kullanıyoruz.
    if: needs.changes.outputs.schema == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # NEDEN VAR (2026-08-21): aynı gün içinde 3 ayrı olayda (V-09,
    # "Keşfet 403", bu tarama) sütun/tablo bazlı GRANT'ların unutulması
    # tekrar eden bir hata sınıfı oldu — en ciddisinde anon rolünün
    # stores tablosunda tablo-seviyesi SELECT/TRUNCATE yetkisi vardı,
    # edit_token/user_id sızıyordu. TRUNCATE RLS'ten muaftır, insan
    # hafızasına güvenilemez. Bu iş, migration zincirini SIFIRDAN yerel
    # bir Supabase'te uygulayıp anon/authenticated'in hiçbir tabloda
    # TRUNCATE/MAINTAIN/REFERENCES/TRIGGER yetkisi kalmadığını doğrular —
    # biri yeni bir tabloda/migration'da bunu yeniden açarsa (kasıtlı
    # veya yanlışlıkla) PR kırmızıya düşer.
    #
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Seed adımını yalnız bu iş için kapat
        # NEDEN: seed.sql, pg_dump'in ürettiği COPY ... FROM STDIN biçimini
        # kullanıyor (yasal metinlerdeki noktalı virgül/kaçış karakterleri
        # yüzünden — bkz. seed.sql'in kendi yorumu). CI'daki `supabase start`
        # bu COPY akışını "No source stream defined" (57014) hatasıyla
        # besleyemiyor — GRANT bekçisiyle ilgisi yok, yalnız CI'nın seed'i
        # işleme biçimiyle ilgili. Bu iş satır verisine değil GRANT'lara
        # bakıyor, seed'e ihtiyacı yok. Yalnız bu iş içindeki geçici kopyayı
        # değiştiriyoruz — commit edilen config.toml (gerçek yerel geliştirme
        # için seed açık kalmalı) değişmiyor.
        run: |
          sed -i '/^# If enabled, seeds the database after migrations during a db reset\.$/{n;s/^enabled = true$/enabled = false/}' supabase/config.toml

      - name: Yerel Supabase'i başlat (migration zinciri sıfırdan uygulanır)
        run: supabase start

      - name: GRANT güvenlik bekçisi — TRUNCATE/MAINTAIN/REFERENCES/TRIGGER
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f supabase/tests/grant_guard_smoke.sql

      - name: Engagement tablosu erişim sözleşmesi
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f supabase/tests/vitrin_engagement_events_security_smoke.sql

      - name: Yerel Supabase'i durdur
        if: always()
        run: supabase stop

  flutter:
    name: Flutter — analiz ve testler
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bağımlılıklar
        run: flutter pub get

      - name: Biçim kontrolü
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Statik analiz
        run: dart analyze --fatal-infos

      - name: Testler
        run: flutter test --reporter expanded

  schema-drift:
    name: Şema üretim hattı — sapma kontrolü
    needs: changes
    if: needs.changes.outputs.schema == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Next.js bağımlılıkları
        working-directory: public_web
        run: npm ci

      - name: Şemayı JSON'a çıkar
        working-directory: public_web
        run: npx tsx ../tool/sema_disa_aktar.ts

      - name: Flutter bağımlılıkları
        run: flutter pub get

      - name: JSON'dan Dart üret
        run: dart run tool/alan_semasi_uret.dart

      - name: JSON'dan Dart üret (kategori core)
        run: dart run tool/business_categories_uret.dart

      - name: Üretilen Dart dosyasını biçimlendir
        run: dart format lib/config/vitrin_alanlari.g.dart lib/config/business_categories.g.dart

      - name: Sapma var mı kontrol et
        run: |
          if ! git diff --exit-code -- shared/vitrin_alanlari.json lib/config/vitrin_alanlari.g.dart; then
            echo "::error::Üretilen şema dosyaları commit edilmiş hâlleriyle uyuşmuyor. Şemayı yeniden üret ve değişiklikleri commit et."
            exit 1
          fi

      - name: Sapma var mı kontrol et (kategori core)
        run: |
          if ! git diff --exit-code -- shared/business_categories.json lib/config/business_categories.g.dart; then
            echo "::error::Kategori core çıktısı ortak JSON ile uyuşmuyor. tool/business_categories_uret.dart'ı tekrar çalıştır."
            exit 1
          fi

      - name: JSON'dan Dart üret (mesaj kataloğu)
        run: dart run tool/mesaj_semasi_uret.dart

      - name: Üretilen Dart dosyasını biçimlendir (mesaj kataloğu)
        run: dart format lib/config/vixrex_mesajlar.g.dart

      - name: Sapma var mı kontrol et (mesaj kataloğu)
        run: |
          if ! git diff --exit-code -- shared/vixrex_mesajlar.json lib/config/vixrex_mesajlar.g.dart; then
            echo "::error::Mesaj kataloğu commit edilmiş hâliyle uyuşmuyor. tool/mesaj_semasi_uret.dart'ı tekrar çalıştır ve değişiklikleri commit et."
            exit 1
          fi

  public_web:
    name: Next.js — lint, tip, test, build
    needs: changes
    if: needs.changes.outputs.public_web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: public_web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: public_web/package-lock.json

      - name: Bağımlılıklar
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tip kontrolü
        run: npm run typecheck

      - name: Testler
        run: npm run test

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

  public_web_e2e:
    name: Next.js — E2E (canlı vitrin, gerçek tarayıcı)
    # 2026-08-17 dersi: CSP img-src allowlist'e Unsplash/QR eklenmeyince vitrin
    # görselleri sessizce engellendi; hiçbir test katmanı bunu yakalamadı
    # (vitest node env + kontrat testleri kaynak metni okuyor, e2e CI'da hiç
    # koşmuyordu). Bu job, canlı public vitrine karşı gerçek tarayıcıda
    # koşar; görsel yükleme bozulursa kırmızıya düşer.
    needs: changes
    # Canlı production'a karşı koşar — yalnız main'e push'ta (merge sonrası
    # canlıda doğrular). PR'da koşmak yanıltıcı olur: PR'ın kodu canlıda
    # olmadığı için her zaman kırmızı gösterir. PR'da kaynak-kontrat testi
    # (security-headers-contract.test.ts) CSP hostlarını zaten doğruluyor.
    if: needs.changes.outputs.public_web == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: public_web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: public_web/package-lock.json

      - name: Bağımlılıklar
        run: npm ci

      - name: Chromium kurulumu
        run: npx playwright install --with-deps chromium

      - name: E2E (canlı vitrin — görsel yükleme kontratı dahil)
        run: npm run e2e
        env:
          # Varsayılan: https://vixrex-public.vercel.app (production).
          # Preview'a karşı koşmak için E2E_PUBLIC_BASE_URL ayarlanabilir.
          E2E_PUBLIC_BASE_URL: ${{ vars.E2E_PUBLIC_BASE_URL || 'https://vixrex-public.vercel.app' }}
