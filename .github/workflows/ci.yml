name: CI

# Her PR ve main push'ında ucuz yüzey sınıflandırması çalışır.
# Flutter, şema ve Next.js işleri yalnız ilgili production yüzeyi değiştiğinde koşar.
# Bilinmeyen veya sınıflandırılamayan path güvenli varsayımla bütün işleri açar.

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  FLUTTER_VERSION: "3.44.4"

jobs:
  secret-tarama:
    name: Secret sızıntı taraması
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  auth-config-check:
    name: Supabase auth security config check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check leaked password protection
        # DİKKAT (2026-08-17): secrets context'i step-level `if` içinde
        # KULLANILAMAZ (yalnız env/with içinde geçerli) — önceki sürüm
        # `if: ${{ secrets.X != '' }}` yazıyordu, bu workflow dosyasını
        # GitHub'da geçersiz kılıyordu ve ci.yml #189'dan beri HİÇ
        # çalışmıyordu (0s "invalid workflow" fail). Davranış korundu:
        # secret'lar tanımlı değilse adım sessizce atlanır.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Supabase secret'ları tanımlı değil — kontrol atlanıyor."
            exit 0
          fi
          config=$(curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth")

          hibp=$(echo "$config" | jq -r '.password_hibp_enabled // false')
          min_len=$(echo "$config" | jq -r '.password_min_length // 0')

          echo "password_hibp_enabled=$hibp"
          echo "password_min_length=$min_len"

          if [ "$hibp" != "true" ]; then
            echo "::error::Leaked Password Protection kapalı (password_hibp_enabled=false). Supabase Dashboard → Authentication → Password Protection üzerinden açın."
            exit 1
          fi

          if [ "$min_len" -lt 8 ] 2>/dev/null; then
            echo "::error::Minimum password length $min_len < 8. Supabase Dashboard → Authentication üzerinden en az 8 yapın."
            exit 1
          fi

  changes:
    name: Değişiklik yüzeyi
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      flutter: ${{ steps.classify.outputs.flutter }}
      schema: ${{ steps.classify.outputs.schema }}
      public_web: ${{ steps.classify.outputs.public_web }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Yüzeyleri sınıflandır
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python .github/scripts/changed_surfaces.py --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  flutter:
    name: Flutter — analiz ve testler
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bağımlılıklar
        run: flutter pub get

      - name: Biçim kontrolü
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Statik analiz
        run: dart analyze --fatal-infos

      - name: Testler
        run: flutter test --reporter expanded

  schema-drift:
    name: Şema üretim hattı — sapma kontrolü
    needs: changes
    if: needs.changes.outputs.schema == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: public_web/package-lock.json

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Next.js bağımlılıkları
        working-directory: public_web
        run: npm ci

      - name: Şemayı JSON'a çıkar
        working-directory: public_web
        run: npx tsx ../tool/sema_disa_aktar.ts

      - name: Flutter bağımlılıkları
        run: flutter pub get

      - name: JSON'dan Dart üret
        run: dart run tool/alan_semasi_uret.dart

      - name: Üretilen Dart dosyasını biçimlendir
        run: dart format lib/config/vitrin_alanlari.g.dart

      - name: Sapma var mı kontrol et
        run: |
          if ! git diff --exit-code -- shared/vitrin_alanlari.json lib/config/vitrin_alanlari.g.dart; then
            echo "::error::Üretilen şema dosyaları commit edilmiş hâlleriyle uyuşmuyor. Şemayı yeniden üret ve değişiklikleri commit et."
            exit 1
          fi

      - name: JSON'dan Dart üret (mesaj kataloğu)
        run: dart run tool/mesaj_semasi_uret.dart

      - name: Üretilen Dart dosyasını biçimlendir (mesaj kataloğu)
        run: dart format lib/config/vixrex_mesajlar.g.dart

      - name: Sapma var mı kontrol et (mesaj kataloğu)
        run: |
          if ! git diff --exit-code -- shared/vixrex_mesajlar.json lib/config/vixrex_mesajlar.g.dart; then
            echo "::error::Mesaj kataloğu commit edilmiş hâliyle uyuşmuyor. tool/mesaj_semasi_uret.dart'ı tekrar çalıştır ve değişiklikleri commit et."
            exit 1
          fi

  public_web:
    name: Next.js — lint, tip, test, build
    needs: changes
    if: needs.changes.outputs.public_web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: public_web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: public_web/package-lock.json

      - name: Bağımlılıklar
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tip kontrolü
        run: npx tsc --noEmit

      - name: Testler
        run: npm run test

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

  public_web_e2e:
    name: Next.js — E2E (canlı vitrin, gerçek tarayıcı)
    # 2026-08-17 dersi: CSP img-src allowlist'e Unsplash/QR eklenmeyince vitrin
    # görselleri sessizce engellendi; hiçbir test katmanı bunu yakalamadı
    # (vitest node env + kontrat testleri kaynak metni okuyor, e2e CI'da hiç
    # koşmuyordu). Bu job, canlı public vitrine karşı gerçek tarayıcıda
    # koşar; görsel yükleme bozulursa kırmızıya düşer.
    needs: changes
    # Canlı production'a karşı koşar — yalnız main'e push'ta (merge sonrası
    # canlıda doğrular). PR'da koşmak yanıltıcı olur: PR'ın kodu canlıda
    # olmadığı için her zaman kırmızı gösterir. PR'da kaynak-kontrat testi
    # (security-headers-contract.test.ts) CSP hostlarını zaten doğruluyor.
    if: needs.changes.outputs.public_web == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/chore/e2e-visual-snapshots')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: public_web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: public_web/package-lock.json

      - name: Bağımlılıklar
        run: npm ci

      - name: Chromium kurulumu
        run: npx playwright install --with-deps chromium

      - name: E2E (canlı vitrin — görsel yükleme kontratı dahil)
        run: npx playwright test visual-regression.spec.ts --update-snapshots
        env:
          E2E_PUBLIC_BASE_URL: ${{ vars.E2E_PUBLIC_BASE_URL || 'https://vixrex-public.vercel.app' }}

      - name: Snapshot'ları yükle (geçici — commit için indirilecek)
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots
          path: public_web/e2e/visual-regression.spec.ts-snapshots/
          if-no-files-found: error
