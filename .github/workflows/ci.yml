name: CI

# Her pull request'te ve main'e her push'ta otomatik çalışır.
# Amaç: bir değişiklik başka bir yeri bozduğunda CANLIYA ÇIKMADAN ÖNCE haber vermek.
#
# Not: android-apk.yml testleri tek tek adıyla sayıyor ve yalnız elle tetikleniyor.
# Bu dosya ondan farklı olarak TÜM test paketini otomatik koşar; yeni eklenen
# testin listeye eklenmesi gerekmez.

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.4"

jobs:
  flutter:
    name: Flutter — analiz ve testler
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bağımlılıklar
        run: flutter pub get

      - name: Biçim kontrolü
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Statik analiz
        run: dart analyze --fatal-infos

      - name: Testler
        run: flutter test --reporter expanded

  schema-drift:
    name: Şema üretim hattı — sapma kontrolü
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # public_web/src/lib/vitrinFieldSchema.ts tek kaynak; shared/vitrin_alanlari.json
    # ve lib/config/vitrin_alanlari.g.dart bundan üretilip commit ediliyor
    # (tool/sema_disa_aktar.ts, tool/alan_semasi_uret.dart). Elle çalıştırmaya
    # güvenmek sapmaya yol açtı (2026-08-10'da fark edildi: kaldırılmış bir
    # "tema" alanı iki üretilen dosyada da hâlâ duruyordu). Bu iş üretimi
    # yeniden çalıştırıp committed dosyalarla karşılaştırır.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: public_web/package-lock.json

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Next.js bağımlılıkları
        working-directory: public_web
        run: npm ci

      - name: Şemayı JSON'a çıkar
        working-directory: public_web
        run: npx tsx ../tool/sema_disa_aktar.ts

      - name: Flutter bağımlılıkları
        run: flutter pub get

      - name: JSON'dan Dart üret
        run: dart run tool/alan_semasi_uret.dart

      - name: Üretilen Dart dosyasını biçimlendir
        run: dart format lib/config/vitrin_alanlari.g.dart

      - name: Sapma var mı kontrol et
        run: |
          if ! git diff --exit-code -- shared/vitrin_alanlari.json lib/config/vitrin_alanlari.g.dart; then
            echo "::error::Üretilen şema dosyaları commit edilmiş hâlleriyle uyuşmuyor. Şemayı değiştirdiysen şu sırayla yeniden üret: cd public_web && npx tsx ../tool/sema_disa_aktar.ts && cd .. && dart run tool/alan_semasi_uret.dart && dart format lib/config/vitrin_alanlari.g.dart — sonra değişiklikleri commit et."
            exit 1
          fi

  public_web:
    name: Next.js — lint, tip, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: public_web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: public_web/package-lock.json

      - name: Bağımlılıklar
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tip kontrolü
        run: npx tsc --noEmit

      - name: Testler
        run: npm run test

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
