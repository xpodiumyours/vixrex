name: Vixrex Assistant Safety

# Bu workflow yalnız güvenli geliştirme dalındaki Assistant çalışmasını
# doğrulamak için vardır. Ana CI self-hosted Windows runner'da `shell: bash`
# geçici script yolunu bozabildiği için Assistant'a ait Next.js + Flutter
# doğrulamaları burada Windows'un doğal PowerShell kabuğuyla bağımsız koşar.
# Ürün/release davranışı değiştirilmez.

on:
  pull_request:
    paths:
      - "public_web/**"
      - "lib/**"
      - "test/**"
      - "shared/**"
      - "supabase/**"
      - ".github/workflows/vixrex-assistant-safety.yml"
  push:
    branches:
      - "work/vixrex-assistant-reliability-20260909"

concurrency:
  group: vixrex-assistant-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.4"

jobs:
  public_web:
    name: Next.js — Assistant güvenlik kapısı
    runs-on: [self-hosted, windows, vixrex]
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: public_web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: public_web/package-lock.json

      - name: Bağımlılıklar
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tip kontrolü
        run: npx tsc --noEmit

      - name: Testler
        run: npm run test

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

  flutter:
    name: Flutter — Assistant güvenlik kapısı
    runs-on: [self-hosted, windows, vixrex]
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bağımlılıklar
        run: flutter pub get

      - name: Biçim kontrolü
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Statik analiz
        run: dart analyze --fatal-infos

      - name: Testler
        run: flutter test --reporter expanded
