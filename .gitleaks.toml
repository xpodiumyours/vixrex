# Gitleaks ayarları — VixRex
#
# NEDEN VAR (2026-09-07): Secret taraması yalnız çalışma ağacını değil git
# geçmişini de tarıyor. Geçmişte iki bulgu var ve ikisi de gerçek kimlik
# bilgisi değil: sözleşme testlerinin "zayıf/örnek anahtar reddediliyor mu"
# diye sınamak için bilerek yazdığı sahte sabitler.
#
# İzin commit'e bağlı verildi. Dosya yolu (`paths`) ile izin vermek DENENDİ
# ve geri alındı: gitleaks o dizini taramadan tamamen çıkarıyor — ölçüldü,
# public_web/tests altına konan gerçek görünümlü bir AWS anahtarı hiç
# yakalanmadı. Aşağıdaki biçim o kör noktayı yaratmaz; adı geçen iki
# commit dışında her şey taranmaya devam eder.
#
# YENİ test sabiti eklerken: satırın sonuna `// gitleaks:allow` yaz. Bu
# yorum yeni commit'lerde çalışır ve incelemede görünür — buraya commit
# eklemek gerekmez.

[extend]
useDefault = true

[[allowlists]]
description = """
public_web/tests/owner-session-cookie-contract.test.ts — TEST_SESSION_TOKEN:
64 hex karakterlik sahte oturum jetonu. Owner çerezinin imza doğrulamasını
sınamak için kasıtlı sabit.
"""
commits = ["8316f4259720fb351367f9b1ff95011a7832d75e"]

[[allowlists]]
description = """
public_web/tests/rent-demo-security-fingerprint.test.ts — RATE_LIMIT_SECRET
olarak verilen "test-secret-..." değeri. IP'nin ham dönmediğini sınamak için
kasıtlı sabit.
"""
commits = ["a2bfc037945a1d723e6b4d473d1f700400f8f509"]

[[allowlists]]
description = """
public_web/tests/api/fatura-okuyucu-durumu.test.ts — OPENROUTER_API_KEY
olarak verilen sahte değer. Uç noktanın anahtarı dışarı vermediğini sınamak
için kasıtlı sabitti; gerçek bir anahtar değildi. Sonraki commit'te gerçek
anahtar biçiminden uzak bir değerle değiştirildi.
"""
commits = ["8963ebe2c07aa402e3c9fd6c2fc4701875370bb1"]
